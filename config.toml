# 插件基本信息
[plugin]

# 插件名称
name = "grok_search_plugin"

# 插件版本
version = "1.0.2"

# 是否启用插件
enabled = true


# 模型配置
[model]

# 兼容 OpenAI Chat Completions 的接口地址
base_url = ""

# 模型 API 密钥
api_key = ""

# 使用的模型名称
model = "grok-4"

# 生成温度，建议较低以减少事实性问题的发散
temperature = 0.2


# 搜索配置
[search]

# 搜索归纳方向，建议强调热点、更新、事实性和时效性
direction = "请优先关注近期热点、互联网讨论、模型更新、版本变化、公告、新闻和事实准确性。"

# 是否附带最近聊天上下文帮助理解问题
enable_context = true

# 读取最近多少秒内的聊天记录
time_gap = 270

# 最多读取多少条聊天记录
max_limit = 30

# 单次请求超时时间（秒）
timeout = 25.0

# 最大并发搜索请求数
max_concurrency = 3

# 失败重试次数
retry_attempts = 3

# 最小重试等待时间（秒）
retry_wait_min = 1.5

# 最大重试等待时间（秒）
retry_wait_max = 8.0

# 输出模式：brief / structured / raw
output_mode = "brief"


# 图片识别与缓存配置
[vision]

# 是否启用图片视觉分析
enabled = true

# 视觉模型接口地址
base_url = ""

# 视觉模型 API 密钥
api_key = ""

# 视觉模型名称
model = "Gemini 3.1 Flash Lite Preview"

# 图片识别类问题是否只使用视觉模型直接回答
direct_answer_mode = false

# 视觉分析温度
temperature = 0.1

# 视觉分析超时时间（秒）
timeout = 20.0

# 视觉分析提示词
prompt = "请准确识别图片中的人物、角色、作品线索、文字信息和可能的梗来源，不要编造。"

# 当前消息无图时，是否回退查找最近图片
fallback_to_recent_image = true

# 是否优先查找当前用户最近发送的图片
prefer_same_user_recent_image = true

# 回溯最近图片的时间范围（秒）
recent_image_time_gap = 120

# 最多检查最近多少条消息
recent_image_scan_limit = 15

# 图片分析缓存文件路径
cache_db_path = "data/plugins/grok_search_plugin/cache.db"

# 图片分析缓存有效期（秒）
cache_ttl_seconds = 2592000


# 提示词配置
[prompt]

# 系统提示词
system_prompt = "你是专业的实时信息检索助手，擅长结合外部最新信息进行事实核查、热点整理与简明总结。"
